<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADWAL TRUCK DCM & HITOSHI</title>
    <style>
        :root {
            --surface: rgba(255, 255, 255, 0.95);
            --filter-bg: #f8fafc;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --table-header-bg: #f1f5f9;
            --loading-bg: #e0f2fe;
            --loading-text: #0369a1;
            --note-bg: #fffbebf5;
            --note-border: #fef08a;
            --note-text: #854d0e;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(244, 246, 249, 0.15), rgba(244, 246, 249, 0.15)), 
                        url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--surface);
            padding: 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(8px);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .filter-container {
            background: var(--filter-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .filter-container {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text-primary);
            box-sizing: border-box;
            outline: none;
        }

        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #ffffff;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: var(--table-header-bg);
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: var(--loading-text);
            font-size: 13px;
            background: var(--loading-bg);
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .note-box {
            background-color: var(--note-bg);
            border: 1px solid var(--note-border);
            border-left: 5px solid #eab308;
            border-radius: 8px;
            padding: 16px 20px;
            color: var(--note-text);
        }

        .note-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .note-box ol {
            margin: 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .note-box li {
            margin-bottom: 4px;
        }

        .note-box li:last-child {
            margin-bottom: 0;
        }
        
        .tgl-badge {
            font-size: 12px;
            color: #475569;
            font-weight: normal;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>🚚 JADWAL TRUCK DCM & HITOSHI</h2>
    </div>
    
    <div class="filter-container">
        <div>
            <label for="pilihTruck">Pilih Truck :</label>
            <select id="pilihTruck" onchange="filterData()">
                <option value="semua">DCM & HITOSHI</option>
                <option value="DCM">DCM</option>
                <option value="HITOSHI">HITOSHI</option>
            </select>
        </div>
        <div>
            <label for="pilihTanggal">Pilih tanggal untuk melihat jadwal:</label>
            <input type="date" id="pilihTanggal" onchange="filterData()">
        </div>
    </div>

    <div id="loadingInfo" class="loading">Sedang memuat data...</div>
    <div id="statsSummary" class="stats">📋 Total: 0 rit</div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Jadwal Truck</th>
                    <th>Kategori</th>
                    <th>Tujuan</th>
                    <th>Jumlah Rit</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="note-box">
        <div class="note-title">📌 Catatan Penting:</div>
        <ol>
            <li>Pengiriman ke PT. SUZUKI maximal jam 07:00 wib (Pagi) truck sudah berangkat.</li>
            <li>Pic Control: Dian Lukmana (PPIC).</li>
        </ol>
    </div>
</div>

<script>
    const GITHUB_REPO = "diandianlukmana-alt/jadwal-truck-shipping";
    let databaseJadwal = [];

    // Fungsi standarisasi format tanggal ke YYYY-MM-DD
    function normalisasiTanggal(strTgl) {
        if (!strTgl) return '';
        const cleanStr = strTgl.trim();
        
        // Format DD-MM-YYYY -> YYYY-MM-DD
        if (cleanStr.includes('-')) {
            const parts = cleanStr.split('-');
            if (parts[0].length === 2 && parts[2].length === 4) {
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
        }
        
        // Format DD/MM/YYYY -> YYYY-MM-DD
        if (cleanStr.includes('/')) {
            const parts = cleanStr.split('/');
            if (parts[0].length === 2 && parts[2].length === 4) {
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
        }

        return cleanStr;
    }

    // Format tampilan tanggal ke DD-MM-YYYY
    function formatKeTanggalIndo(yyyy_mm_dd) {
        if (!yyyy_mm_dd || !yyyy_mm_dd.includes('-')) return yyyy_mm_dd;
        const [y, m, d] = yyyy_mm_dd.split('-');
        return `${d}-${m}-${y}`;
    }

    async function ambilDataTxt(namaFile) {
        try {
            const url = `https://cdn.jsdelivr.net/gh/${GITHUB_REPO}@main/${namaFile}?t=${new Date().getTime()}`;
            const res = await fetch(url);
            if (!res.ok) return [];
            
            const text = await res.text();
            const lines = text.split('\n');
            const data = [];

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) return;

                const parts = trimmed.split('|').map(p => p.trim());
                if (parts.length >= 5) {
                    data.push({
                        tanggal: normalisasiTanggal(parts[0]),
                        truck: parts[1],
                        kategori: parts[2],
                        tujuan: parts[3],
                        rit: parseInt(parts[4]) || 1
                    });
                }
            });

            return data;
        } catch (e) {
            console.error("Gagal membaca " + namaFile, e);
            return [];
        }
    }

    async function muatSemuaData() {
        const loadingEl = document.getElementById('loadingInfo');
        if (loadingEl) loadingEl.style.display = 'block';

        try {
            const [dcmData, hitoshiData] = await Promise.all([
                ambilDataTxt('data_dcm.txt'),
                ambilDataTxt('data_hitoshi.txt')
            ]);
            databaseJadwal = [...dcmData, ...hitoshiData];
        } catch (e) {
            console.error(e);
        }

        if (loadingEl) loadingEl.style.display = 'none';

        const inputTgl = document.getElementById('pilihTanggal');
        if (!inputTgl.value) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            inputTgl.value = `${yyyy}-${mm}-${dd}`;
        }

        filterData();
    }

    function filterData() {
        const tglInput = document.getElementById('pilihTanggal').value;
        const filterTruck = document.getElementById('pilihTruck').value;
        const tbody = document.getElementById('isiTabel');
        const stats = document.getElementById('statsSummary');

        if (!tglInput) {
            stats.innerHTML = `📋 Total: <b>0</b> rit`;
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td></tr>`;
            return;
        }

        const filtered = databaseJadwal.filter(item => {
            const matchTanggal = (item.tanggal === tglInput);
            let matchTruck = true;
            if (filterTruck !== 'semua') {
                matchTruck = (item.truck || '').toUpperCase().includes(filterTruck.toUpperCase());
            }
            return matchTanggal && matchTruck;
        });

        tbody.innerHTML = '';
        const totalRit = filtered.reduce((acc, curr) => acc + (parseInt(curr.rit) || 0), 0);
        stats.innerHTML = `📋 Total: <b>${totalRit}</b> rit`;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">Tidak ada jadwal pengiriman pada tanggal ini.</td></tr>`;
            return;
        }

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <b>${item.truck}</b>
                    <span class="tgl-badge">📅 ${formatKeTanggalIndo(item.tanggal)}</span>
                </td>
                <td>${item.kategori}</td>
                <td><b>${item.tujuan}</b></td>
                <td>${item.rit}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = muatSemuaData;
</script>

</body>
</html>
