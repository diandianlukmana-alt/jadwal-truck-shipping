<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADWAL TRUCK DCM & HITOSHI</title>
    <!-- Skrip Netlify Identity untuk Login/Password -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        :root {
            --surface: rgba(255, 255, 255, 0.95);
            --filter-bg: #f8fafc;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --table-header-bg: #f1f5f9;
            --loading-bg: #e0f2fe;
            --loading-text: #0369a1;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(244, 246, 249, 0.15), rgba(244, 246, 249, 0.15)), 
                        url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--surface);
            padding: 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(8px);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h2 {
            margin: 0;
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-inoac {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .filter-container {
            background: var(--filter-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .filter-container {
                grid-template-columns: 1fr;
            }
            .header-title {
                flex-direction: column-reverse;
                align-items: flex-start;
            }
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-primary);
        }

        select, input[type="date"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text-primary);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: var(--table-header-bg);
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: var(--loading-text);
            font-size: 13px;
            background: var(--loading-bg);
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>🚚 JADWAL TRUCK DCM & HITOSHI</h2>
        <!-- Logo INOAC -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/INOAC_logo.svg" alt="INOAC Logo" class="logo-inoac" onerror="this.src='https://www.inoac.co.jp/en/assets/img/common/logo.svg'">
    </div>
    
    <div class="filter-container">
        <div>
            <label for="pilihTruck">Pilih Truck :</label>
            <select id="pilihTruck" onchange="filterData()">
                <option value="semua">DCM & HITOSHI</option>
                <option value="DCM">DCM</option>
                <option value="HITOSHI">HITOSHI</option>
            </select>
        </div>
        <div>
            <label for="pilihTanggal">Pilih tanggal untuk melihat jadwal:</label>
            <input type="date" id="pilihTanggal" onchange="filterData()">
        </div>
    </div>

    <div id="loadingInfo" class="loading">Sedang memuat data...</div>
    <div id="statsSummary" class="stats">📋 Total: 0 rit</div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Jadwal Truck</th>
                    <th>Kategori</th>
                    <th>Tujuan</th>
                    <th>Jumlah rit</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let databaseJadwal = [];

    // Fungsi normalisasi tanggal ke YYYY-MM-DD
    function formatTanggalStandard(tglStr) {
        if (!tglStr) return '';
        const tgl = new Date(tglStr);
        if (!isNaN(tgl.getTime())) {
            const yyyy = tgl.getFullYear();
            const mm = String(tgl.getMonth() + 1).padStart(2, '0');
            const dd = String(tgl.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }
        return tglStr.trim();
    }

    // Ambil data dari file TXT (Metode Cadangan)
    async function ambilFileTxt(namaFile) {
        try {
            const respon = await fetch(`${namaFile}?v=${new Date().getTime()}`);
            if (!respon.ok) return [];
            const teks = await respon.text();
            
            const baris = teks.split(/\r?\n/);
            const hasil = [];

            baris.forEach(row => {
                if (!row.trim()) return;
                const item = row.split(';').map(s => s.trim());
                if (item.length < 5) return;
                
                hasil.push({
                    tanggal: formatTanggalStandard(item[0]),
                    truck: item[1],
                    kategori: item[2],
                    tujuan: item[3],
                    rit: parseInt(item[4]) || 1
                });
            });

            return hasil;
        } catch (e) {
            return [];
        }
    }

    // Ambil data dari Netlify CMS / Decap CMS
    async function muatSemuaData() {
        const loadingEl = document.getElementById('loadingInfo');
        loadingEl.style.display = 'block';
        databaseJadwal = [];

        try {
            // 1. Coba ambil dari folder CMS (content/jadwal_dcm atau JSON)
            const resDCM = await fetch('/content/jadwal_dcm/index.json?v=' + new Date().getTime()).catch(() => null);
            const resHITOSHI = await fetch('/content/jadwal_hitoshi/index.json?v=' + new Date().getTime()).catch(() => null);

            let cmsData = [];
            if (resDCM && resDCM.ok) {
                const data = await resDCM.json();
                cmsData = [...cmsData, ...(Array.isArray(data) ? data : [data])];
            }
            if (resHITOSHI && resHITOSHI.ok) {
                const data = await resHITOSHI.json();
                cmsData = [...cmsData, ...(Array.isArray(data) ? data : [data])];
            }

            // Normalisasi data dari CMS
            cmsData = cmsData.map(item => ({
                tanggal: formatTanggalStandard(item.tanggal || item.date || ''),
                truck: item.jadwal_truck || item.truck || 'DCM',
                kategori: item.kategori || '-',
                tujuan: item.tujuan || '-',
                rit: parseInt(item.jumlah_rit || item.rit) || 1
            }));

            // 2. Ambil juga dari file TXT jika ada
            const [txtDCM, txtHITOSHI] = await Promise.all([
                ambilFileTxt('data_dcm.txt'),
                ambilFileTxt('data_hitoshi.txt')
            ]);

            databaseJadwal = [...cmsData, ...txtDCM, ...txtHITOSHI];

            loadingEl.style.display = 'none';
            
            // Set default tanggal hari ini pada input jika belum dipilih
            const inputTgl = document.getElementById('pilihTanggal');
            if (!inputTgl.value) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                inputTgl.value = `${yyyy}-${mm}-${dd}`;
            }

            filterData();
        } catch (err) {
            console.error(err);
            loadingEl.style.display = 'none';
            filterData();
        }
    }

    function filterData() {
        const tglInput = document.getElementById('pilihTanggal').value;
        const filterTruck = document.getElementById('pilihTruck').value;
        const tbody = document.getElementById('isiTabel');
        const stats = document.getElementById('statsSummary');

        if (!tglInput) {
            stats.innerHTML = `📋 Total: <b>0</b> rit`;
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td></tr>`;
            return;
        }

        const filtered = databaseJadwal.filter(item => {
            const matchTanggal = item.tanggal === tglInput;

            let matchTruck = true;
            if (filterTruck !== 'semua') {
                matchTruck = (item.truck || '').toUpperCase().includes(filterTruck.toUpperCase());
            }

            return matchTanggal && matchTruck;
        });

        tbody.innerHTML = '';
        const totalRit = filtered.reduce((acc, curr) => acc + (parseInt(curr.rit) || 0), 0);
        stats.innerHTML = `📋 Total: <b>${totalRit}</b> rit`;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">Tidak ada jadwal pengiriman pada tanggal ini.</td></tr>`;
            return;
        }

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${item.truck}</b></td>
                <td>${item.kategori}</td>
                <td><b>${item.tujuan}</b></td>
                <td>${item.rit}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = muatSemuaData;

    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>

</body>
</html>
