<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADWAL TRUCK DCM & HITOSHI</title>
    <!-- Skrip Netlify Identity untuk Login/Password -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        :root {
            --surface: rgba(255, 255, 255, 0.94);
            --filter-bg: #f8fafc;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --table-header-bg: #f1f5f9;
            --loading-bg: #e0f2fe;
            --loading-text: #0369a1;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Latar belakang gambar truk dengan overlay putih transparan */
            background: linear-gradient(rgba(244, 246, 249, 0.82), rgba(244, 246, 249, 0.82)), 
                        url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--surface);
            padding: 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(6px);
        }

        h2 {
            margin-top: 0;
            color: var(--text-primary);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-container {
            background: var(--filter-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .filter-container {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-primary);
        }

        select, input[type="date"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #ffffff;
            color: var(--text-primary);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .stats {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: var(--table-header-bg);
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: var(--loading-text);
            font-size: 13px;
            background: var(--loading-bg);
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 JADWAL TRUCK DCM & HITOSHI</h2>
    
    <div class="filter-container">
        <div>
            <label for="pilihTruck">Pilih Truck :</label>
            <select id="pilihTruck" onchange="gantiSourceData()">
                <option value="semua">DCM & HITOSHI</option>
                <option value="data_dcm.txt">DCM</option>
                <option value="data_hitoshi.txt">HITOSHI</option>
            </select>
        </div>
        <div>
            <label for="pilihTanggal">Pilih tanggal untuk melihat jadwal:</label>
            <input type="date" id="pilihTanggal" onchange="filterData()">
        </div>
    </div>

    <div id="loadingInfo" class="loading">Sedang memuat data...</div>
    <div id="statsSummary" class="stats">📋 Menampilkan 0 pemakaian truck dan 0 rit</div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Jadwal Truck</th>
                    <th>Kategori</th>
                    <th>Tujuan</th>
                    <th>Jumlah rit</th>
                </tr>
            </thead>
            <tbody id="isiTabel">
                <tr>
                    <td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let databaseJadwal = [];

    async function ambilFileTxt(namaFile) {
        const respon = await fetch(`${namaFile}?v=${new Date().getTime()}`);
        if (!respon.ok) throw new Error(`Gagal membaca ${namaFile}`);
        const teks = await respon.text();
        
        const baris = teks.split(/\r?\n/);
        const hasil = [];

        baris.forEach(row => {
            if (!row.trim()) return;
            const item = row.split(';').map(s => s.trim());
            if (item.length < 5) return;
            
            hasil.push({
                tanggal: item[0],
                truck: item[1],
                kategori: item[2],
                tujuan: item[3],
                rit: item[4]
            });
        });

        return hasil;
    }

    async function gantiSourceData() {
        const pilihan = document.getElementById('pilihTruck').value;
        const loadingEl = document.getElementById('loadingInfo');
        loadingEl.style.display = 'block';

        try {
            if (pilihan === 'semua') {
                const [dcm, hitoshi] = await Promise.all([
                    ambilFileTxt('data_dcm.txt'),
                    ambilFileTxt('data_hitoshi.txt')
                ]);
                databaseJadwal = [...dcm, ...hitoshi];
            } else {
                databaseJadwal = await ambilFileTxt(pilihan);
            }
            loadingEl.style.display = 'none';
            filterData();
        } catch (err) {
            console.error(err);
            loadingEl.style.display = 'block';
            loadingEl.innerText = '❌ Gagal memuat data file .txt';
        }
    }

    function filterData() {
        const tglInput = document.getElementById('pilihTanggal').value;
        const tbody = document.getElementById('isiTabel');
        const stats = document.getElementById('statsSummary');

        if (!tglInput) {
            stats.innerHTML = `📋 Menampilkan 0 pemakaian truck dan 0 rit`;
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">Silakan pilih tanggal terlebih dahulu.</td></tr>`;
            return;
        }

        const filtered = databaseJadwal.filter(item => {
            const tglData = item.tanggal.replace(/[\/\-]/g, '').trim();
            const tglPilihan = tglInput.replace(/[\/\-]/g, '').trim();
            return tglData === tglPilihan;
        });

        tbody.innerHTML = '';

        const totalPemakaianTruck = filtered.length;
        const totalRit = filtered.reduce((acc, curr) => acc + (parseInt(curr.rit) || 0), 0);

        stats.innerHTML = `📋 Menampilkan <b>${totalPemakaianTruck}</b> pemakaian truck dan <b>${totalRit}</b> rit`;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">Tidak ada jadwal pengiriman pada tanggal ini.</td></tr>`;
            return;
        }

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${item.truck}</b></td>
                <td>${item.kategori}</td>
                <td><b>${item.tujuan}</b></td>
                <td>${item.rit}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = gantiSourceData;

    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>

</body>
</html>
